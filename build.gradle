plugins {
    id 'java'
}

group = 'br.com.zenon'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(Copy).configureEach {
    filteringCharset = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.mysql:mysql-connector-j:26.7.0'
}
